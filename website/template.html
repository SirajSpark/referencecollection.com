    <!-- Resolve the theme before first paint. Must stay inline and blocking:
         deferring it flashes the light palette at dark-mode visitors. -->
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem("app-appearance"); } catch (e) { }
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            var apply = function (mode) {
                document.documentElement.setAttribute("app-appearance", mode);
            };
            apply(stored || (media.matches ? "dark" : "light"));
            /* Only follow the OS while the visitor has no explicit preference. */
            if (!stored) {
                media.addEventListener('change', function (event) {
                    apply(event.matches ? "dark" : "light");
                });
            }
        })();
    </script>
